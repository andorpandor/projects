<!DOCTYPE html>
<html lang="no">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yr Designutforskning 3.0 - Designprinsipper (1: Yr er vær)</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        :root {
            --poster-bg: #EDF4FF;
            --poster-text: #3B2C7E;
        }
    </style>
</head>

<body>
    <!-- Poster 1: Yr er vær -->
    <section class="poster-section">
        <div class="container">
            <div class="logo-container">
                <img src="svg/Logo.svg" alt="Yr Logo" class="yr-logo-svg">
            </div>
            <div class="content">
                <div class="illustration-side">
                    <img src="svg/rain.svg" alt="Yr Rain Illustration">
                </div>
                <div class="text-side">
                    <h1 class="title">Yr er vær</h1>
                    <p class="description">
                        Det skal være tydelig på alle flater at Yr er en værtjeneste. Vi prioriterer vær over alt annet.
                    </p>
                </div>
            </div>
        </div>
    </section>
</body>

</html>
