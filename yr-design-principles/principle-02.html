<!DOCTYPE html>
<html lang="no">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yr Designutforskning 3.0 - Designprinsipper (2: Yr er effektiv)</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        :root {
            --poster-bg: #FBF8CB;
            --poster-text: #0C551F;
        }
    </style>
</head>

<body>
    <!-- Poster 2: Yr er effektiv -->
    <section class="poster-section">
        <div class="container">
            <div class="logo-container">
                <img src="svg/Logo.svg" alt="Yr Logo" class="yr-logo-svg">
            </div>
            <div class="content">
                <div class="illustration-side">
                    <img src="svg/diamond.svg" alt="Yr Diamond Illustration">
                </div>
                <div class="text-side">
                    <h1 class="title">Yr er effektiv</h1>
                    <p class="description">
                        Vi prioriterer effektiv oversikt for den daglige værsjekken, og gjør flere detaljer lett
                        tilgjengelig når brukeren trenger det.
                    </p>
                </div>
            </div>
        </div>
    </section>
</body>

</html>
