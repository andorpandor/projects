<!DOCTYPE html>
<html lang="no">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yr Designutforskning 3.0 - Designprinsipper (3: Yr er tilgjengelig)</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        :root {
            --poster-bg: #FFF0F7;
            --poster-text: #064E42;
        }
    </style>
</head>

<body>
    <!-- Poster 3: Yr er tilgjengelig -->
    <section class="poster-section">
        <div class="container">
            <div class="logo-container">
                <img src="svg/Logo.svg" alt="Yr Logo" class="yr-logo-svg">
            </div>
            <div class="content">
                <div class="illustration-side">
                    <img src="svg/kiss.svg" alt="Yr Kiss Illustration">
                </div>
                <div class="text-side">
                    <h1 class="title">Yr er tilgjengelig</h1>
                    <p class="description">
                        Yr er enkel å bruke og lett å forstå. Tjenesten er universelt utformet og fungerer for et
                        mangfold av mennesker, situasjoner og enheter.</p>
                    <p class="description">Våre tjenester skal alltid virke, være oppdaterte
                        og til å stole på.</p>
                </div>
            </div>
        </div>
    </section>
</body>

</html>
